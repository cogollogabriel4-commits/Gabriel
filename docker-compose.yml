services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: expedientes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: expedientes
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expedientes"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://expedientes:${POSTGRES_PASSWORD}@db:5432/expedientes
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE}
      ADMIN_CORREO: ${ADMIN_CORREO}
      ADMIN_CLAVE: ${ADMIN_CLAVE}
    volumes:
      - archivos:/datos/archivos

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

volumes:
  db:
  archivos:
  caddy:
